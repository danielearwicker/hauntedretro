name: Deploy to Cloudflare

# Deploy the game to your Cloudflare account (Workers + Durable Objects) on
# every push to main.
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # fail fast instead of hanging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Wrangler v4 requires Node >= 22
          cache: "npm"
      - run: npm ci
      - run: npx wrangler deploy
        env:
          # Encrypted GitHub Actions secrets (Settings -> Secrets and
          # variables -> Actions).
          # CLOUDFLARE_API_TOKEN: create at the account-scoped API Tokens page
          #   (dash.cloudflare.com -> your account -> Manage Account -> Account
          #   API Tokens), using the "Edit Cloudflare Workers" template.
          # CLOUDFLARE_ACCOUNT_ID: Workers & Pages -> right-hand sidebar.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
